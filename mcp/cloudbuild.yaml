# Cloud Build configuration for MCP Server
steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/mcph-mcp:$BUILD_ID"
      - "-t"
      - "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/mcph-mcp:latest"
      - "-f"
      - "Dockerfile"
      - "--build-context"
      - "project-root=.."
      - ".."
    dir: "mcp"

  # Push the container image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/mcph-mcp"

  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "mcph-mcp"
      - "--image"
      - "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/mcph-mcp:$BUILD_ID"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "5"
      - "--concurrency"
      - "50"
      - "--timeout"
      - "900"
      - "--set-env-vars"
      - "NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,REGION=${_REGION}"

# Store images in Artifact Registry
images:
  - "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/mcph-mcp:$BUILD_ID"
  - "${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/mcph-mcp:latest"

# Substitutions for build configuration
substitutions:
  _ARTIFACT_REGISTRY_LOCATION: "us-central1"
  _ARTIFACT_REGISTRY_REPO: "mcph-repo"
  _REGION: "us-central1"

# Options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
